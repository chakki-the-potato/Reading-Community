<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>책책책 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../logo_image/chaek-icon.svg">
<link rel="stylesheet" href="../static/css/admin.css">
</head>
<body>

<section id="loginView" class="login-view">
  <form id="loginForm" class="panel login-panel" novalidate>
    <img src="../logo_image/chaek-horizontal-dark.svg" alt="책책책" class="login-logo">
    <h1>관리자 로그인</h1>
    <label>아이디<input id="loginId" autocomplete="username"></label>
    <label>비밀번호<input id="loginPw" type="password" autocomplete="current-password"></label>
    <p id="loginError" class="error" role="alert"></p>
    <button type="submit" class="btn primary">로그인</button>
    <a href="../" class="back-link">← 사이트로 돌아가기</a>
  </form>
</section>

<div id="appView" class="app-view" hidden>
  <header class="topbar">
    <a href="../" class="topbar-brand"><img src="../logo_image/chaek-horizontal-dark.svg" alt="책책책"> 관리자</a>
    <div class="topbar-actions">
      <button id="tokenBtn" class="btn small" type="button">GitHub 연결</button>
      <button id="logoutBtn" class="btn small ghost" type="button">로그아웃</button>
    </div>
  </header>

  <section id="tokenPanel" class="panel token-panel" hidden>
    <h2>GitHub 연결</h2>
    <p class="hint">저장하려면 GitHub 토큰이 한 번 필요해요. 이 컴퓨터 브라우저에만 저장됩니다.</p>
    <div class="inline">
      <input id="tokenInput" type="password" placeholder="github_pat_로 시작하는 토큰">
      <button id="tokenSave" class="btn" type="button">저장</button>
    </div>
    <p id="tokenMsg" class="hint"></p>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="verify" role="tab">인증 확인</button>
    <button class="tab" data-tab="fix" role="tab">인증 수정</button>
    <button class="tab" data-tab="payments" role="tab">납부 체크</button>
    <button class="tab" data-tab="quarter" role="tab">멤버·분기</button>
    <button class="tab" data-tab="notice" role="tab">공지</button>
  </nav>

  <main>
    <section class="tab-panel" data-panel="verify">
      <div class="panel">
        <h2>카톡 파일로 인증 확인</h2>
        <label>분기<select id="verifyQuarter" class="quarter-select"></select></label>
        <fieldset class="choice">
          <legend>무엇을 할까요?</legend>
          <label><input type="radio" name="verifyMode" value="refresh" checked> 중간 점검</label>
          <label><input type="radio" name="verifyMode" value="end"> 분기 종료</label>
        </fieldset>
        <label class="check"><input type="checkbox" id="examToggle"> 시험 기간이 있어요 (이 기간은 사진만 있어도 인증)</label>
        <div id="examDates" class="inline" hidden>
          <input type="date" id="examStart" aria-label="시험 시작일"> ~ <input type="date" id="examEnd" aria-label="시험 종료일">
        </div>
        <label class="drop" id="chatDrop">
          <input type="file" id="chatFile" accept=".txt,.csv" multiple>
          <span id="chatLabel">카톡에서 내보낸 .txt 또는 .csv 파일을 고르세요</span>
        </label>
        <p id="verifyError" class="error" role="alert"></p>
        <button id="verifyRun" class="btn primary" type="button">인증 확인 실행</button>
        <p id="verifyStatus" class="hint"></p>
      </div>
      <div id="verifyResult"></div>
    </section>

    <section class="tab-panel" data-panel="fix">
      <div class="panel">
        <h2>확인이 필요한 인증</h2>
        <div id="reviewList"><p class="hint">"인증 확인"을 실행하면 메시지는 올렸는데 X가 된 날이 여기에 나와요.</p></div>
      </div>
      <div class="panel">
        <h2>직접 고치기</h2>
        <label>분기<select id="fixQuarter" class="quarter-select"></select></label>
        <div class="inline wrap">
          <select id="fixMember" aria-label="멤버"></select>
          <select id="fixDate" aria-label="날짜"></select>
          <span id="fixCurrent" class="hint"></span>
        </div>
        <div class="inline">
          <button class="btn fix-value" data-value="O" type="button">O로</button>
          <button class="btn fix-value" data-value="X" type="button">X로</button>
          <button class="btn fix-value" data-value="?" type="button">?로</button>
        </div>
        <p id="fixError" class="error" role="alert"></p>
      </div>
    </section>

    <section class="tab-panel" data-panel="payments">
      <div class="panel">
        <h2>벌금 납부 체크</h2>
        <label>분기<select id="payQuarter" class="quarter-select"></select></label>
        <p id="paySummary" class="hint"></p>
        <div id="payList"></div>
      </div>
    </section>

    <section class="tab-panel" data-panel="quarter">
      <div class="panel">
        <h2>새 분기 시작</h2>
        <p class="hint">분기 전환은 "인증 확인"에서 지난 분기를 "분기 종료"로 처리한 뒤, 여기서 새 분기를 시작하면 끝나요.</p>
        <label>분기 이름<input id="newLabel" placeholder="7월 1분기"></label>
        <div class="inline wrap">
          <label>시작일<input type="date" id="newStart"></label>
          <label>종료일<input type="date" id="newEnd"></label>
        </div>
        <h3>멤버 <span id="memberCount" class="hint"></span></h3>
        <p id="memberSource" class="hint"></p>
        <div id="memberChips" class="chips"></div>
        <div class="inline">
          <input id="memberInput" placeholder="추가할 이름">
          <button id="memberAdd" class="btn" type="button">추가</button>
        </div>
        <p id="quarterError" class="error" role="alert"></p>
        <button id="quarterStart" class="btn primary" type="button">새 분기 시작</button>
        <p id="quarterStatus" class="hint"></p>
      </div>
    </section>

    <section class="tab-panel" data-panel="notice">
      <div class="panel">
        <h2>카카오톡 공지</h2>
        <fieldset class="choice">
          <legend>공지 종류</legend>
          <label><input type="radio" name="noticeKind" value="settlement" checked> 벌금 정산</label>
          <label><input type="radio" name="noticeKind" value="general"> 일반 규칙</label>
          <label><input type="radio" name="noticeKind" value="recruit"> 모집</label>
          <label><input type="radio" name="noticeKind" value="quarterEnd"> 분기 종료</label>
        </fieldset>
        <div id="noticeFields" class="inline wrap">
          <label data-for="settlement quarterEnd">분기<select id="noticeQuarter" class="quarter-select"></select></label>
          <label data-for="quarterEnd">다음 분기 이름<input id="noticeNext" placeholder="7월 1분기"></label>
        </div>
        <textarea id="noticeText" rows="10" aria-label="공지 내용"></textarea>
        <div class="inline between">
          <span class="hint">고쳐 써도 돼요.</span>
          <button id="noticeCopy" class="btn" type="button">복사</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="savebar">
    <span id="saveStatus">저장할 변경이 없어요</span>
    <div class="inline">
      <button id="discardBtn" class="btn ghost" type="button" hidden>되돌리기</button>
      <button id="saveBtn" class="btn primary" type="button" disabled>저장하고 사이트에 반영</button>
    </div>
  </footer>
</div>

<script type="module" src="../static/js/admin/app.js"></script>
</body>
</html>
